name: ground station app

# Builds the Ground Station desktop app for Windows (installer), macOS and
# Linux, and checks that each built app starts (its --selftest). A tag gs-v*
# also publishes them as a GitHub release, which the website links to.
on:
  push:
    branches: ["**"]
    paths:
      - "onboard/groundstation/**"
      - "onboard/packaging/**"
      - "onboard/ardupilot/**"
      - "onboard/models/**"
      - "onboard/VERSION"
      - ".github/workflows/ground-station-app.yml"
    tags: ["gs-v*"]          # path filters don't apply to tags
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: onboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup (Windows installer)
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Install the build tools
        run: python -m pip install -r groundstation/requirements.txt -r packaging/requirements.txt

      - name: Build the app and run its self-test
        env:
          # Windows and macOS builds must be able to open their own window
          SILM_REQUIRE_WINDOW: ${{ runner.os != 'Linux' && '1' || '0' }}
        run: python packaging/build_app.py --smoke

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}
          if-no-files-found: error
          path: |
            onboard/packaging/out/*.exe
            onboard/packaging/out/*.zip
            onboard/packaging/out/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/gs-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # also under fixed names, so the website can always link to the latest
      - name: Name the files and add checksums
        run: |
          cd dist
          for f in *-Setup-*.exe; do cp "$f" UAV-SILM-Ground-Station-Setup.exe; done
          for f in *-windows.zip; do cp "$f" UAV-SILM-Ground-Station-windows.zip; done
          for f in *-macos.zip; do cp "$f" UAV-SILM-Ground-Station-macos.zip; done
          for f in *-linux.tar.gz; do cp "$f" UAV-SILM-Ground-Station-linux.tar.gz; done
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: UAV SILM Ground Station ${{ github.ref_name }}
          files: dist/*
          body: |
            The UAV SILM Ground Station as a desktop app.

            - **Windows:** `UAV-SILM-Ground-Station-Setup.exe` - double-click, no administrator rights needed. Windows may warn that the publisher is unknown (the app is not code-signed): More info, Run anyway.
            - **macOS (Apple silicon):** `UAV-SILM-Ground-Station-macos.zip` - unzip, drag to Applications. The first time, right-click the app and choose Open (it is not notarised).
            - **Linux:** `UAV-SILM-Ground-Station-linux.tar.gz` - unpack and run `./install.sh`.

            Check a download against `SHA256SUMS.txt`. Not yet flown on a real aircraft; see www.uavsilm.eu.
