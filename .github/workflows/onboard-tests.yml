name: onboard tests

on:
  push:
    paths: ["onboard/**", ".github/workflows/onboard-tests.yml"]
  pull_request:
    paths: ["onboard/**", ".github/workflows/onboard-tests.yml"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless pyyaml pytest pymavlink lupa ai-edge-litert shellcheck-py paramiko

      # The Ground Station is also tested in a real browser (tests/test_gui_browser.py).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright + Chromium (browser test)
        run: |
          npm install -g playwright@1.63.0
          playwright install --with-deps chromium

      # The real detection model, so the detector is tested with it (not only fakes).
      - name: Fetch the detection model
        run: |
          curl -fsSL -o /tmp/model.zip https://storage.googleapis.com/download.tensorflow.org/models/tflite/coco_ssd_mobilenet_v1_1.0_quant_2018_06_29.zip
          echo "a809cd290b4d6a2e8a9d5dad076e0bd695b8091974e0eed1052b480b2f21b6dc  /tmp/model.zip" | sha256sum -c -
          unzip -p /tmp/model.zip detect.tflite > models/coco_ssd_mobilenet_v1_quant.tflite

      # Parameter names/ranges are checked against the current ArduPlane stable
      # source (read as text only; only ArduPlane/ and libraries/ are fetched).
      - name: Fetch ArduPlane stable source (for the parameter check)
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch ArduPlane-stable --filter=blob:none --sparse \
            https://github.com/ArduPilot/ardupilot.git ardupilot
          cd ardupilot
          git sparse-checkout set ArduPlane libraries
          grep -m1 'define THISFIRMWARE' ArduPlane/version.h

      # Installing the Pi from the Ground Station over SSH is tested against a
      # real SSH server: a throw-away user whose sudo asks for its password.
      - name: SSH server for the Pi-install test
        run: |
          sudo apt-get install -y -q openssh-server
          sudo useradd -m -s /bin/bash -G sudo silmpi
          echo 'silmpi:silm-ci-pass-1' | sudo chpasswd
          sudo ssh-keygen -A
          sudo mkdir -p /run/sshd
          printf 'Port 2222\nListenAddress 127.0.0.1\nPasswordAuthentication yes\nKbdInteractiveAuthentication no\nUsePAM yes\nSubsystem sftp internal-sftp\n' > "$RUNNER_TEMP/sshd_config"
          sudo /usr/sbin/sshd -f "$RUNNER_TEMP/sshd_config"

      - name: Run tests
        env:
          ARDUPILOT_SRC: ${{ runner.temp }}/ardupilot
          SILM_SSH_TEST: silmpi:silm-ci-pass-1@127.0.0.1:2222
        run: python -m pytest -q -rs
