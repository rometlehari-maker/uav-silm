# SILM onboard reconnaissance configuration.
# Everything runs on the aircraft's Raspberry Pi 3. No ground link is used.

# ---------------------------------------------------------------------------
# Flight controller link (read-only telemetry from the Matek H743 / ArduPilot)
# ---------------------------------------------------------------------------
telemetry:
  # Pi <-> H743 serial. Common options:
  #   /dev/serial0            Pi GPIO UART wired to an H743 TELEM port
  #   /dev/ttyUSB0            USB-serial adapter
  #   /dev/ttyACM0            H743 USB port
  # In ArduPilot set the matching SERIALx_PROTOCOL=2 (MAVLink2) and baud.
  connection: /dev/serial0
  baud: 115200
  source_system: 200          # companion ID; keep != 1 (the autopilot)

# ---------------------------------------------------------------------------
# Camera. The SIYI A2 Mini is analog (AHD): feed it through an AHD->USB capture
# dongle and it appears as a UVC device (source: usb). A Pi CSI camera would be
# source: picamera. source: file replays an image folder for bench testing.
# ---------------------------------------------------------------------------
camera:
  source: usb                 # usb | picamera | file
  device: 0                   # /dev/video0 ; or a folder path when source: file
  width: 1280
  height: 720
  fps: 10

# ---------------------------------------------------------------------------
# Object detector (TensorFlow Lite). If you drop in a *_edgetpu.tflite model and
# a Coral USB stick is attached it is used automatically.
# ---------------------------------------------------------------------------
detector:
  enabled: true
  # Point this at your trained ag/forestry model once exported:
  #   model:  models/silm_farm.tflite         (YOLO, from training/export.py)
  #   labels: models/silm_farm_labels.txt
  #   format: yolo
  # The COCO SSD baseline below works out of the box for car/truck/person.
  model: models/ssd_mobilenet_v2_coco_quant.tflite
  labels: models/coco_labels.txt
  format: auto            # auto | ssd | yolo  (auto picks by output tensors)
  score_threshold: 0.45
  iou_threshold: 0.45     # NMS IoU for YOLO models
  tiled: false            # true = tiled inference (better small-object recall,
  tile_grid: [2, 2]       #        costs grid[0]*grid[1]x compute -> Coral only)

# Classes to keep and photograph. Must match names in the model's labels file.
# With the trained ag/forestry model (training/classes.yaml) these all apply;
# with the COCO baseline only car/truck/person exist and the rest are ignored.
targets:
  - car
  - truck
  - tractor
  - combine
  - harvester
  - baler
  - hay_bale
  - livestock
  - silo
  - barn
  - logging_truck
  - timber_stack
  # "fire" and "smoke" also come from the heuristic below as a no-training path.

# ---------------------------------------------------------------------------
# Forest-fire / smoke heuristic (works with no training; see fire.py)
# ---------------------------------------------------------------------------
fire:
  enabled: true
  detect_smoke: true
  min_fire_area_frac: 0.002
  min_smoke_area_frac: 0.03
  fire_score: 0.60
  smoke_score: 0.50

# ---------------------------------------------------------------------------
# Geo-referencing: pixel -> ground lat/lon
# ---------------------------------------------------------------------------
georef:
  # Lens model. Best: run tools/calibrate_camera.py and paste its
  # `calibration:` block here (focal length, centre, distortion). Without it,
  # hfov_deg is used with an ideal distortion-free lens.
  # calibration:
  #   width: 1280
  #   height: 720
  #   camera_matrix: [[fx, 0, cx], [0, fy, cy], [0, 0, 1]]
  #   dist_coeffs: [k1, k2, p1, p2, k3]
  hfov_deg: 86.0              # horizontal field of view of the lens (CALIBRATE)
  forward_tilt_deg: 90.0      # 90 = straight down (nadir); lower = look forward
  yaw_offset_deg: 0.0
  roll_offset_deg: 0.0
  # ground_elevation_m: null  # reserved for future DEM support

# ---------------------------------------------------------------------------
# When is recon allowed to save? Keeps the bench and launch run-up clean.
# ---------------------------------------------------------------------------
activation:
  active_modes: [AUTO, GUIDED]
  min_alt_m: 20.0
  require_armed: true
  always_on: false            # true only for bench tests
  detect_every_n_frames: 1    # raise to 2-3 if the Pi 3 can't keep up
  max_telemetry_age_s: 2.0

# ---------------------------------------------------------------------------
# Multi-frame confirmation: only save an object after it has been seen in
# `frames` frames within `window_s` at the same place (within radius_m on the
# ground). Removes most one-frame false alarms. frames: 1 disables it.
# ---------------------------------------------------------------------------
confirm:
  frames: 2
  window_s: 3.0
  radius_m: 30.0

# ---------------------------------------------------------------------------
# Companion health: CPU temperature, throttling / under-voltage, free storage,
# processing rate -> health.ndjson. Low storage sheds load automatically.
# ---------------------------------------------------------------------------
health:
  interval_s: 10
  warn_temp_c: 70
  low_disk_mb: 500          # below this: stop archiving raw frames
  critical_disk_mb: 100     # below this: stop saving detections

# ---------------------------------------------------------------------------
# GPS-loss failsafe companion aids (the real failsafe is in ArduPilot; see
# ardupilot/gps_denied_failsafe.param). These are monitor + backup only.
# ---------------------------------------------------------------------------
failsafe:
  enabled: true             # optical-flow velocity aid on/off
  send_to_fc: false         # DO NOT enable until validated on the bench
                            # (then also EK3_SRC2_VELXY=6 on the FC)
  max_speed_mps: 60         # estimates above this are discarded as implausible
  max_rate_hz: 5.0
  proc_width: 320
  min_features: 20

# ---------------------------------------------------------------------------
# Storage (SD card or USB stick on the aircraft)
# ---------------------------------------------------------------------------
storage:
  output_dir: /home/pi/silm_captures
  jpeg_quality: 90
  save_annotated: true
  cooldown_s: 8.0             # don't resave the same class within this window...
  min_separation_m: 40.0      # ...unless it's at least this far away on the ground
  save_all_frames: false      # true = also archive raw frames for retraining
  frame_interval_s: 2.0       # ...one every this many seconds

# ---------------------------------------------------------------------------
# Optional offline satellite/terrain basemap (pre-cached on the ground).
# Do NOT cache Google imagery (against their terms); use a permitted source.
# ---------------------------------------------------------------------------
tiles:
  enabled: false
  path: /home/pi/basemap.mbtiles
  zoom: 17
