# SILM onboard configuration - DEFAULTS.
# Runs on the aircraft's Raspberry Pi 4 Model B (2 GB). No link is used in flight.
#
# You normally do NOT edit this file. Answer the questions in the laptop
# Ground Station instead: it sends your answers to the Pi as a small
# settings.yaml (over the Pi's Wi-Fi hotspot or a USB stick), which is applied
# on top of these defaults. Updating the software never overwrites it.

# Where the Ground Station's settings file lives on the Pi (merged on top of this file).
settings_file: ~/silm-settings/settings.yaml

# flight = record only while armed, in AUTO, above activation.min_alt_m
# bench  = record whenever something is seen (ground camera test, not for flight)
program:
  mode: flight

# Live status for the ground agent / laptop GUI (written ~1 per second).
status:
  path: /run/silm/status.json

# ---------------------------------------------------------------------------
# Flight controller link (read-only telemetry from the Matek H743 / ArduPilot)
# ---------------------------------------------------------------------------
telemetry:
  # Pi <-> H743 serial. Common options:
  #   /dev/serial0            Pi GPIO UART wired to an H743 TELEM port
  #   /dev/ttyUSB0            USB-serial adapter
  #   /dev/ttyACM0            H743 USB port
  # In ArduPilot set the matching SERIALx_PROTOCOL=2 (MAVLink2) and baud.
  connection: /dev/serial0
  baud: 115200
  source_system: 200          # companion ID; keep != 1 (the autopilot)

# ---------------------------------------------------------------------------
# Camera: SIYI A2 mini, 1080p video over ETHERNET (RTSP), 160 deg fisheye on a
# single-axis pitch gimbal. Plug its Ethernet straight into the Pi and give
# the Pi an address on 192.168.144.x (see FLIGHT_READY.md B1). No capture
# hardware needed. Other sources: usb | picamera | file (bench testing).
# ---------------------------------------------------------------------------
camera:
  source: rtsp
  url: rtsp://192.168.144.25:8554/main.264
  backend: auto               # auto | gstreamer (Pi hardware decode) | ffmpeg
  decoder: v4l2h264dec        # Pi 4 hardware H.264; avdec_h264 = software
  width: 1920                 # the stream's real size (preflight.py reports it)
  height: 1080
  latency_ms: 150             # capture-to-arrival delay; geotags use the
                              # aircraft state this long before arrival
  open_timeout_s: 30
  device: 0                   # for source: usb / file

# ---------------------------------------------------------------------------
# SIYI gimbal (UDP SDK): points the camera straight down and reports its real
# angle for geo-referencing. If it never answers (preflight.py shows it), set
# enabled: false and measure the camera's tilt for georef.forward_tilt_deg.
# ---------------------------------------------------------------------------
gimbal:
  enabled: true
  ip: 192.168.144.25
  port: 37260
  pitch_deg: -90              # -90 = straight down
  angle_frame: earth          # earth = stabilised against aircraft pitch; body = not
  poll_hz: 5

# ---------------------------------------------------------------------------
# Object detector (TensorFlow Lite). If you drop in a *_edgetpu.tflite model and
# a Coral USB stick is attached it is used automatically.
# ---------------------------------------------------------------------------
detector:
  enabled: true
  # Point this at your trained ag/forestry model once exported:
  #   model:  models/silm_farm.tflite         (YOLO, from training/export.py)
  #   labels: models/silm_farm_labels.txt
  #   format: yolo
  # The COCO SSD baseline below works out of the box for car/truck/person.
  model: models/coco_ssd_mobilenet_v1_quant.tflite
  labels: models/coco_labels.txt
  format: auto            # auto | ssd | yolo  (auto picks by output tensors)
  score_threshold: 0.45
  # Optional per-class thresholds (override score_threshold for that class).
  # Lower for a rare class you'd rather not miss, higher for one that causes
  # false alarms. Tune from the confusion matrix / eval_model.py output.
  # class_thresholds:
  #   fire: 0.30
  #   person: 0.60
  iou_threshold: 0.45     # NMS IoU for YOLO models
  # Detection region (normalised x0, y0, x1, y1) and tiling. A downward
  # fisheye has its best resolution in the centre; running the model only on a
  # central crop, in tiles, gives it far more pixels per object. With the whole
  # 1080p frame at 320 px even a combine at 100 m is ~11x4 px (too small); the
  # central half in 2x2 tiles makes it ~46x16 px (tools/pixels_on_target.py).
  # Costs grid[0]*grid[1] model runs per frame: check the speed with preflight.py.
  roi: [0.25, 0.25, 0.75, 0.75]
  tiled: true
  tile_grid: [2, 2]

# Classes to keep and photograph. Must match names in the model's labels file.
# With the trained ag/forestry model (training/classes.yaml) these all apply;
# with the COCO baseline only car/truck/person exist and the rest are ignored.
targets:
  - car
  - truck
  - tractor
  - combine
  - harvester
  - baler
  - hay_bale
  - livestock
  - silo
  - barn
  - logging_truck
  - timber_stack
  # "fire" and "smoke" also come from the heuristic below as a no-training path.

# ---------------------------------------------------------------------------
# Forest-fire / smoke heuristic (works with no training; see fire.py)
# ---------------------------------------------------------------------------
fire:
  enabled: true
  detect_smoke: true
  min_fire_area_frac: 0.002
  min_smoke_area_frac: 0.03
  fire_score: 0.60
  smoke_score: 0.50

# ---------------------------------------------------------------------------
# Geo-referencing: pixel -> ground lat/lon
# ---------------------------------------------------------------------------
georef:
  # Lens model. Best: run tools/calibrate_camera.py --fisheye and paste its
  # `calibration:` block here. Without it, an ideal 160 deg equidistant
  # fisheye is assumed (fine near the centre, less so at the edges).
  # calibration:
  #   model: fisheye
  #   width: 1920
  #   height: 1080
  #   camera_matrix: [[fx, 0, cx], [0, fy, cy], [0, 0, 1]]
  #   dist_coeffs: [k1, k2, k3, k4]
  lens: fisheye
  hfov_deg: 160.0             # SIYI A2 mini horizontal field of view
  forward_tilt_deg: 90.0      # fallback camera tilt when the gimbal doesn't
                              # report (90 = straight down)
  yaw_offset_deg: 0.0
  roll_offset_deg: 0.0
  # ground_elevation_m: null  # reserved for future DEM support

# ---------------------------------------------------------------------------
# When is recon allowed to save? Keeps the bench and launch run-up clean.
# ---------------------------------------------------------------------------
activation:
  active_modes: [AUTO, GUIDED]
  min_alt_m: 20.0
  require_armed: true
  always_on: false            # true only for bench tests
  detect_every_n_frames: 1    # raise to 2-3 if preflight.py says the Pi can't keep up
  max_telemetry_age_s: 2.0

# ---------------------------------------------------------------------------
# Multi-frame confirmation: only save an object after it has been seen in
# `frames` frames within `window_s` at the same place (within radius_m on the
# ground). Removes most one-frame false alarms. frames: 1 disables it.
# ---------------------------------------------------------------------------
confirm:
  frames: 2
  window_s: 3.0
  radius_m: 30.0

# ---------------------------------------------------------------------------
# Companion health: CPU temperature, throttling / under-voltage, free storage,
# processing rate -> health.ndjson. Low storage sheds load automatically.
# ---------------------------------------------------------------------------
health:
  interval_s: 10
  warn_temp_c: 75           # the Pi 4 slows itself down from 80 C
  low_mem_mb: 200           # 2 GB Pi 4: warn below this much free memory
  low_disk_mb: 500          # below this: stop archiving raw frames
  critical_disk_mb: 100     # below this: stop saving detections

# ---------------------------------------------------------------------------
# GPS-loss failsafe companion aids (the real failsafe is in ArduPilot; see
# ardupilot/gps_denied_failsafe.param). These are monitor + backup only.
# ---------------------------------------------------------------------------
failsafe:
  enabled: true             # optical-flow velocity aid on/off
  send_to_fc: false         # DO NOT enable until validated on the bench
                            # (then also EK3_SRC2_VELXY=6 on the FC)
  max_speed_mps: 60         # estimates above this are discarded as implausible
  max_rate_hz: 5.0
  proc_width: 320
  min_features: 20

# ---------------------------------------------------------------------------
# Storage (SD card or USB stick on the aircraft)
# ---------------------------------------------------------------------------
storage:
  output_dir: ~/silm_captures
  jpeg_quality: 90
  save_annotated: true
  cooldown_s: 8.0             # don't resave the same class within this window...
  min_separation_m: 40.0      # ...unless it's at least this far away on the ground
  save_all_frames: false      # true = also archive raw frames for retraining
  frame_interval_s: 2.0       # ...one every this many seconds

# ---------------------------------------------------------------------------
# Optional offline satellite/terrain basemap (pre-cached on the ground).
# Do NOT cache Google imagery (against their terms); use a permitted source.
# ---------------------------------------------------------------------------
tiles:
  enabled: false
  path: ~/basemap.mbtiles
  zoom: 17

# ---------------------------------------------------------------------------
# Ground agent (systemd/silm-agent.service): moves settings in and flights out.
#   Wi-Fi: the Pi runs its own hotspot on the ground; the laptop joins it and
#          the Ground Station talks to http://10.42.0.1:8080. Wi-Fi is switched
#          OFF while the aircraft is armed or airborne (no radio in flight).
#   USB stick: name the stick SILM. Settings written to it by the Ground
#          Station are imported; finished flights are copied onto it.
# ---------------------------------------------------------------------------
agent:
  port: 8080
  wifi_off_when_armed: true
  wifi_back_on_after_s: 20      # disarmed and on the ground this long -> Wi-Fi on again
  usb_mount: /mnt/silm_usb      # where the stick labelled SILM is mounted
  copy_flights_to_usb: true
